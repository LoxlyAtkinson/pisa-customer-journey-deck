<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PISA Lean Leadership Assessment - Account Creation</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                    "borderRadius": {

                    "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-page-bg text-on-surface font-body-md min-h-screen flex flex-col w-[390px] mx-auto border-x border-border-subtle relative">
<!-- Header -->
<header class="w-full flex justify-between items-center px-margin-mobile h-16 border-b border-border-subtle bg-card-bg shrink-0">
<div class="font-headline-md text-headline-md text-primary tracking-tight">PISA Lean</div>
<a class="text-text-body text-body-md hover:text-primary transition-colors" href="#">Cancel</a>
</header>
<main class="flex-grow flex flex-col px-margin-mobile py-[32px] overflow-y-auto">
<!-- Step Indicator & Title -->
<div class="mb-[32px]">
<span class="block font-eyebrow text-eyebrow text-on-surface-variant uppercase mb-[8px]">Step 1 of 2</span>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface">Your account</h1>
</div>
<!-- Form Card -->
<div class="bg-card-bg border border-border-subtle p-[24px] rounded-none mb-[24px]">
<form class="flex flex-col gap-[24px]">
<div class="flex flex-col gap-[8px]">
<label class="font-eyebrow text-eyebrow text-text-body uppercase" for="fullName">Full name</label>
<input class="h-[48px] border border-border-subtle bg-transparent px-[16px] text-body-md text-on-surface focus:outline-none focus:border-primary transition-colors rounded-none" id="fullName" placeholder="e.g. Jane Doe" type="text"/>
</div>
<div class="flex flex-col gap-[8px]">
<label class="font-eyebrow text-eyebrow text-text-body uppercase" for="email">Email address</label>
<input class="h-[48px] border border-border-subtle bg-transparent px-[16px] text-body-md text-on-surface focus:outline-none focus:border-primary transition-colors rounded-none" id="email" placeholder="jane@company.com" type="email"/>
</div>
<div class="flex flex-col gap-[8px]">
<label class="font-eyebrow text-eyebrow text-text-body uppercase" for="confirmEmail">Confirm email address</label>
<input class="h-[48px] border border-border-subtle bg-transparent px-[16px] text-body-md text-on-surface focus:outline-none focus:border-primary transition-colors rounded-none" id="confirmEmail" type="email"/>
</div>
<div class="flex flex-col gap-[8px]">
<label class="font-eyebrow text-eyebrow text-text-body uppercase" for="password">Choose a password</label>
<input class="h-[48px] border border-border-subtle bg-transparent px-[16px] text-body-md text-on-surface focus:outline-none focus:border-primary transition-colors rounded-none" id="password" type="password"/>
<p class="font-mono-label text-mono-label text-on-surface-variant mt-[4px]">Must be at least 8 characters long.</p>
</div>
</form>
</div>
<!-- Privacy & Consent -->
<div class="mb-[32px] flex flex-col gap-[16px]">
<p class="font-body-md text-[14px] text-on-surface-variant leading-[1.5]">
                By creating an account, you agree to our <a class="text-primary underline" href="#">Terms of Service</a> and <a class="text-primary underline" href="#">Privacy Policy</a>. We will store your assessment data securely.
            </p>
<label class="flex items-start gap-[12px] cursor-pointer group">
<div class="relative flex items-center justify-center w-[24px] h-[24px] shrink-0 mt-[2px]">
<input class="peer appearance-none w-[20px] h-[20px] border border-border-subtle rounded-none checked:bg-primary checked:border-primary transition-colors cursor-pointer focus:ring-0 focus:outline-none bg-card-bg" type="checkbox"/>
<span class="material-symbols-outlined text-on-primary absolute pointer-events-none opacity-0 peer-checked:opacity-100 text-[16px]" data-icon="check">check</span>
</div>
<span class="font-body-md text-[14px] text-text-body leading-[1.5] group-hover:text-on-surface transition-colors">
                    I would like to receive occasional email updates about leadership insights and new assessment tools. (Optional)
                </span>
</label>
</div>
<!-- Order Summary Card -->
<div class="bg-secondary-panel border border-border-subtle p-[24px] rounded-none mb-[24px]">
<h2 class="font-eyebrow text-eyebrow text-text-body uppercase mb-[16px] border-b border-border-subtle pb-[8px]">Order Summary</h2>
<div class="flex justify-between items-start mb-[12px]">
<span class="font-body-md text-body-md text-on-surface">PISA Lean Leadership Assessment</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">$249.00</span>
</div>
<div class="flex justify-between items-start mt-[16px] pt-[16px] border-t border-border-subtle">
<span class="font-headline-md text-[20px] font-semibold text-on-surface">Total</span>
<span class="font-headline-md text-[20px] font-semibold text-on-surface">$249.00</span>
</div>
</div>
</main>
<!-- Sticky Footer CTA -->
<div class="p-margin-mobile bg-page-bg border-t border-border-subtle mt-auto sticky bottom-0 z-10">
<button class="w-full h-[48px] bg-primary-container text-on-primary font-body-md text-body-md flex items-center justify-center hover:bg-primary transition-colors active:scale-[0.98]">
            Continue to payment
        </button>
</div>
</body></html>
