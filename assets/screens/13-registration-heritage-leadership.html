<body class="bg-page-bg text-text-body font-body-md text-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-[1000px] bg-card-bg border border-border-subtle grid grid-cols-1 md:grid-cols-2">
<!-- Left Side: Image/Context -->
<div class="hidden md:block relative border-r border-border-subtle bg-secondary-panel">
<div class="absolute inset-0 p-12 flex flex-col justify-between">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-4">Leadership Excellence</h2>
<p class="font-body-lg text-body-lg text-text-body max-w-sm">
                        Join our network of strategic thinkers and executive leaders. Register to access insights, assessments, and exclusive support tailored for impactful leadership.
                    </p>
</div>
<div>
<div class="w-full h-64 bg-cover bg-center border border-border-subtle grayscale" data-alt="A sophisticated, high-contrast black and white architectural abstract photograph showing the clean lines and geometric shadows of a modern corporate building. The light is crisp and directional, emphasizing structure and stability, perfectly aligned with a professional, minimalist editorial aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCcpUr5HMmA3VglAFMUOfftz2JoexSwrBe_qkFwnnJoekgPw59D0b3B4ttSD3ayXy5-3QKEKDlc4HKdoLpJ3algSqdo9touyxJCh8fsTTa0Nhoo6mrl8xTQUBaq3pRdmrfgQwsBQq_NZ1ObNEmMLDb2qvjbxiVZpkOM2mE655TJsKq98WufUSgaOuqDF90qEtsGH2D8PqSbQ2esUY07Gf8cqROSq2Mlu7hBu-tVvC3MoZfF0sgnItQ')"></div>
</div>
</div>
</div>
<!-- Right Side: Form -->
<div class="p-8 md:p-12 lg:p-16 flex flex-col justify-center">
<div class="mb-12">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Register</h1>
<p class="font-body-md text-body-md text-text-body">Create your leadership profile.</p>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="block font-eyebrow text-eyebrow text-on-surface uppercase" for="fullName">Full Name</label>
<input class="w-full h-12 px-4 border border-border-subtle bg-card-bg text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md rounded-none" id="fullName" name="fullName" required="" type="text"/>
</div>
<div class="space-y-2">
<label class="block font-eyebrow text-eyebrow text-on-surface uppercase" for="email">Email Address</label>
<input class="w-full h-12 px-4 border border-border-subtle bg-card-bg text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md rounded-none" id="email" name="email" required="" type="email"/>
</div>
<div class="space-y-2">
<label class="block font-eyebrow text-eyebrow text-on-surface uppercase" for="organization">Organization</label>
<input class="w-full h-12 px-4 border border-border-subtle bg-card-bg text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md rounded-none" id="organization" name="organization" required="" type="text"/>
</div>
<div class="space-y-2">
<label class="block font-eyebrow text-eyebrow text-on-surface uppercase" for="role">Current Role</label>
<select class="w-full h-12 px-4 border border-border-subtle bg-card-bg text-on-surface focus:outline-none focus:border-primary focus:ring-0 transition-colors font-body-md text-body-md rounded-none appearance-none" id="role" name="role" required="">
<option disabled="" selected="" value="">Select your role</option>
<option value="executive">Executive (C-Suite / VP)</option>
<option value="director">Director</option>
<option value="manager">Senior Manager</option>
<option value="consultant">Consultant / Advisor</option>
<option value="other">Other</option>
</select>
</div>
<div class="pt-6">
<button class="w-full h-12 bg-primary-container text-on-primary font-body-md text-body-md flex items-center justify-center hover:bg-primary transition-colors" type="submit">
                        Complete Registration
                    </button>
</div>
<div class="text-center pt-4 border-t border-border-subtle mt-8">
<p class="font-body-md text-body-md text-text-body">
                        Already have an account? 
                        <a class="text-primary hover:underline font-semibold" href="#">Sign in here</a>
</p>
</div>
</form>
</div>
</div>
</body></html>
